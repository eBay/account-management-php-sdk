query User {
    user {
        userId
        username
        newUser
        userIdChanged
        userIdLastChangedAt
        userCreatedAt
        registrationMarketPlace
        individualIdentityProfile {
            email
            firstName
            lastName
            middleName
            profileAddress {
                addressLine1
                addressLine2
                city
                stateOrProvince
                postalCode
                countryCode
            }
            primaryPhone {
                phoneNumber
                phoneNumberType
                countryCode
                dialCode
            }
        }
        publicUserProfile {
            businessName
            firstName
            lastName
            email
            fax
            legalInvoiceProvided
            phone {
                phoneNumber
                phoneNumberType
                countryCode
                dialCode
            }
        }
        userStatus {
            displayString
        }
        userType {
            displayString
        }
    }
}
